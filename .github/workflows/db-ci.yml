name: db-ci

# The four steps of Annex A against an empty PostgreSQL. Pull requests toward develop, qa and main only,
# as the course asks to save automation minutes. No schedule and no manual trigger.
on:
  pull_request:
    branches: [develop, qa, main]

concurrency:
  group: db-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # the suite is about one seventh of the commercial one in lines (860 against 6,455); not measured here
    steps:
      - uses: actions/checkout@v4

      - name: Build, rebuild, roll back and rebuild (Annex A)
        run: bash tests/db-ci.sh
