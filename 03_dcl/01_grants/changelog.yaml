databaseChangeLog:
  - changeSet:
      id: dcl-grants-001
      author: FernandaRobayo
      labels: "HU-CSH-001,dcl,grants"
      comment: "Reader and writer: usage of the schema cash_reporting, which the infrastructure creates."
      changes:
        - sqlFile:
            path: 001_grant_schema_usage.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/03_dcl/01_grants/001_grant_schema_usage.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: dcl-grants-002
      author: FernandaRobayo
      labels: "HU-CSH-001,dcl,grants"
      comment: "The application user, created by the infrastructure, receives the writer (Annex J.7)."
      changes:
        - sqlFile:
            path: 002_grant_writer_to_application_user.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/03_dcl/01_grants/002_grant_writer_to_application_user.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: dcl-grants-003
      author: FernandaRobayo
      labels: "HU-CSH-001,dcl,grants"
      comment: "Writer: SELECT and INSERT on the business tables, UPDATE only on cash_session, all four on the two technical tables (AC-D1.8, AC-D1.13, AC-D1.19)."
      changes:
        - sqlFile:
            path: 003_grant_writer_table_privileges.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/03_dcl/01_grants/003_grant_writer_table_privileges.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: dcl-grants-004
      author: FernandaRobayo
      labels: "HU-CSH-001,dcl,grants"
      comment: "Reader: SELECT on the five business tables and nothing else."
      changes:
        - sqlFile:
            path: 004_grant_reader_select.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/03_dcl/01_grants/004_grant_reader_select.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: dcl-grants-005
      author: FernandaRobayo
      labels: "HU-CSH-001,dcl,grants"
      comment: "cash_closure_correction: the writer inserts and reads it, the reader reads it, nobody updates or deletes it (AC-D1.23, AC-D1.19)."
      changes:
        - sqlFile:
            path: 005_grant_correction_table.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/03_dcl/01_grants/005_grant_correction_table.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: dcl-grants-006
      author: FernandaRobayo
      labels: "HU-CSH-002,dcl,grants"
      comment: "Dashboard tables: the writer inserts and reads (updates only the projection), the reader reads the projection, nobody deletes (AC-D2.11)."
      changes:
        - sqlFile:
            path: 006_grant_dashboard_tables.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/03_dcl/01_grants/006_grant_dashboard_tables.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: dcl-grants-007
      author: FernandaRobayo
      labels: "HU-CSH-002,HU-CSH-003,dcl,grants"
      comment: "Fact tables and monthly report: the writer inserts, reads and updates, the reader reads, nobody deletes (AC-D2.21, AC-D3.12)."
      changes:
        - sqlFile:
            path: 007_grant_fact_and_report_tables.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/03_dcl/01_grants/007_grant_fact_and_report_tables.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
