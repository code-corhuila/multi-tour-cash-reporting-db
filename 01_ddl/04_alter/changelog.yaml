databaseChangeLog:
  - changeSet:
      id: ddl-alter-001
      author: FernandaRobayo
      labels: "HU-CSH-001,ddl,04_alter"
      comment: "cash_movement: the required concept of every movement, not blank and at most 200 characters; presupposes an empty table (AC-D1.10)."
      changes:
        - sqlFile:
            path: 001_add_cash_movement_concept.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_alter/001_add_cash_movement_concept.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: ddl-alter-002
      author: FernandaRobayo
      labels: "HU-CSH-001,ddl,04_alter"
      comment: "cash_movement: the optional reservation of an income (plain id of domain 2) and the optional link of a compensating movement (REFUND of an income, INCOME of a refund) to the one it reverses (HU-CSH-001 saga)."
      changes:
        - sqlFile:
            path: 002_add_cash_movement_reservation_id.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_alter/002_add_cash_movement_reservation_id.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: ddl-alter-003
      author: FernandaRobayo
      labels: "HU-SEC-007,ddl,04_alter"
      comment: "outbox_event: the tenth event, PlatformExceptionalAccessUsed, the audit of each use of an exceptional access token, with its authorization as aggregate and a closed key list (HU-SEC-007 G-SEC9-1)."
      changes:
        - sqlFile:
            path: 003_widen_outbox_event_for_platform_exceptional_access_used.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_alter/003_widen_outbox_event_for_platform_exceptional_access_used.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
