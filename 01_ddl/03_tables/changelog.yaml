databaseChangeLog:
  - changeSet:
      id: ddl-tables-001
      author: FernandaRobayo
      labels: "HU-CSH-001,ddl,03_tables"
      comment: "idempotency_key: one key table for the whole domain, unique per tenant and key, 8 to 128 characters (AC-D1.16)."
      changes:
        - sqlFile:
            path: 001_create_idempotency_key.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/001_create_idempotency_key.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: ddl-tables-002
      author: FernandaRobayo
      labels: "HU-CSH-001,ddl,03_tables"
      comment: "outbox_event: the nine events of the service, written with the change they announce (AC-D1.17, norm 5.3.11)."
      changes:
        - sqlFile:
            path: 002_create_outbox_event.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/002_create_outbox_event.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: ddl-tables-003
      author: FernandaRobayo
      labels: "HU-CSH-001,ddl,03_tables"
      # DP-D1-5 (language of the stored codes): the PROPUESTO default is English, as domain 2
      # (OPERATIONAL_OPENING, AUTOMATIC_CREATION, OPEN, CLOSED, FORMAL, AUTOMATIC). Open with Fernanda.
      comment: "cash_session: one cash per tenant and date, its opening, current closing and pending mark (AC-D1.2 to AC-D1.7, RN-CAJ-001)."
      changes:
        - sqlFile:
            path: 003_create_cash_session.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/003_create_cash_session.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: ddl-tables-004
      author: FernandaRobayo
      labels: "HU-CSH-001,ddl,03_tables"
      # DP-D1-1 (immutable closure snapshots): the PROPUESTO default is taken, so each closing is one
      # row of cash_session_closure and the session keeps the current closing. Open with the Project Lead.
      comment: "cash_session_closure: immutable snapshot of each closing, the formula and the sums by medium held by checks (AC-D1.8, RN-CAJ-001, CR-06)."
      changes:
        - sqlFile:
            path: 004_create_cash_session_closure.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/004_create_cash_session_closure.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: ddl-tables-005
      author: FernandaRobayo
      labels: "HU-CSH-001,ddl,03_tables"
      comment: "cash_session_reopening: reason, user, time and the closure reopened; one reopening per closure, many per session (AC-D1.9, RN-CAJ-001, CA-010)."
      changes:
        - sqlFile:
            path: 005_create_cash_session_reopening.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/005_create_cash_session_reopening.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: ddl-tables-006
      author: FernandaRobayo
      labels: "HU-CSH-001,ddl,03_tables"
      comment: "cash_movement: a money fact with a positive amount, the type giving the direction, the after-closing mark only on a transfer, tenant-first key to the session (AC-D1.10 to AC-D1.12, RN-CAJ-001, GAP-013, CA-016)."
      changes:
        - sqlFile:
            path: 006_create_cash_movement.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/006_create_cash_movement.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: ddl-tables-007
      author: FernandaRobayo
      labels: "HU-CSH-001,ddl,03_tables"
      comment: "cash_movement: the unique target of the refund detail's composite key, before the detail exists (AC-D1.14, CR-05)."
      changes:
        - sqlFile:
            path: 007_add_cash_movement_refund_target.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/007_add_cash_movement_refund_target.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: ddl-tables-008
      author: FernandaRobayo
      labels: "HU-CSH-001,ddl,03_tables"
      comment: "refund_movement: one detail per refund movement, agreeing with it by composite key, with plain ids of domain 2 and no key to them (AC-D1.14, AC-D1.15, RN-CAJ-001, CR-05, CR-08)."
      changes:
        - sqlFile:
            path: 008_create_refund_movement.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/008_create_refund_movement.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: ddl-tables-009
      author: FernandaRobayo
      labels: "HU-CSH-001,ddl,03_tables"
      comment: "cash_closure_correction: the correction note of a closed cash, insert-only, pointing at its closure by composite key; several notes per closure (AC-D1.23, DP-D1-2)."
      changes:
        - sqlFile:
            path: 009_create_cash_closure_correction.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/009_create_cash_closure_correction.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
