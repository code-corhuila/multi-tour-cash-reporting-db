      author: FernandaRobayo
      labels: "HU-CSH-002,ddl,03_tables"
      comment: "daily_dashboard_projection: the six sets of the daily dashboard, one row per tenant and local date, arrays within 10000 (AC-D2.2 to AC-D2.7, DP-D2-3)."
      changes:
        - sqlFile:
            path: 010_create_daily_dashboard_projection.sql
